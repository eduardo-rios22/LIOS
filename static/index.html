g></div></div><div class="actions"><button class="btn" onclick="restart()">Reiniciar recorrido</button><button class="btn secondary" onclick="download()">Exportar sesión CSV</button></div></div><div class="panel"><h2>Matriz de escenarios · ilustrativa, pendiente de validación</h2>${rounds.map((r,i)=>`<div class="listrow"><div><strong>Ronda ${i+1}</strong> <span class="tag">Consistente: ${correct(r)}</span> <span class="tag">Mostrada: ${c?recommendation(i):'—'}</span></div><span class="tiny">Riesgo ≤ ${r.risk} · Liquidez ≥ ${r.liq} · Plazo ≤ ${r.horizon} meses</span></div>`).join('')}</div><div class="notice warning">Este panel no asigna la condición. La asignación aleatoria balanceada la hace el servidor al registrar el perfil.</div>`;return}

function detailMessage(payload,fallback){const d=payload&&payload.detail;if(typeof d==='string')return d;if(Array.isArray(d)){const text=d.map(x=>x&&x.msg).filter(Boolean).join(' ');if(text)return text}return fallback}
function showError(message){const appEl=$('app');if(appEl){const banner=document.createElement('div');banner.className='notice warning';banner.setAttribute('role','alert');banner.textContent=message;appEl.prepend(banner)}alert(message)}
async function profileNext(){state.age=$('age').value;state.country=$('country').value;state.experience=$('exp').value;if(!state.age||!state.experience)return alert('Completa los campos');if(Number(state.age)<18||state.experience!=='sí')return alert('En el protocolo doctoral, se requiere mayoría de edad y al menos una inversión financiera personal.');if(starting)return;starting=true;try{let res;try{res=await fetch('/api/v1/experiment/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({age:Number(state.age),country:state.country,experience:state.experience,consent:!!state.consent})})}catch{throw new Error('Error de red al iniciar la sesión')}if(!res.ok)throw new Error(await detailMessage(await res.json().catch(()=>({})),'No se pudo iniciar la sesión'));const data=await res.json();state.sessionId=data.session_id;state.condition=data.condition;state.screen='instructions';render()}catch(e){showError(e.message||'Error de red al iniciar la sesión')}finally{starting=false}}
function enqueueRound(payload){if(persistFailed)return;const run=persistChain.then(async()=>{let res;try{res=await fetch('/api/v1/experiment/round',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch{throw new Error('Error de red al guardar la ronda')}if(!res.ok)throw new Error(detailMessage(await res.json().catch(()=>({})),'No se pudo guardar la ronda'))});persistChain=run;run.catch(err=>{if(persistFailed)return;persistFailed=true;showError(err.message||'No se pudo guardar la ronda')})}
function nextRound(){if(!state.choice)return;let i=state.round;let answer={round:i+1,chosen:state.choice,recommended:recommendation(i),consistent:correct(rounds[i]),error:recommendation(i)!==correct(rounds[i]),accepted:state.choice===recommendation(i),duration_seconds:Math.round((Date.now()-state.started)/1000)};state.answers.push(answer);enqueueRound({session_id:state.sessionId,round:answer.round,chosen:answer.chosen,duration_seconds:answer.duration_seconds});state.choice=null;state.round++;if(state.round===10)state.screen='iu';state.started=Date.now();render()}

function restart(){persistChain=Promise.resolve();starting=false;finishing=false;persistFailed=false;state={...state,screen:'welcome',tab:'study',consent:false,age:'',experience:'',round:0,choice:null,answers:[],iu:[],checks:[],started:0,sessionId:'',condition:null};tab('study')}
function download(){let rows=[['session_id','condition','round','chosen','recommended','consistent','error','accepted','duration_seconds','iu1','iu2','iu3','iu_mean','check_error','check_explanation']];let mean=state.iu.length===3?(state.iu.reduce((a,b)=>a+b,0)/3).toFixed(3):'';state.answers.forEach(a=>rows.push([state.sessionId,state.condition,a.round,a.chosen,a.recommended,a.consistent,a.error,a.accepted,a.duration_seconds,...[0,1,2].map(i=>state.iu[i]??''),mean,state.checks[0]??'',state.checks[1]??'']));if(!state.answers.length)rows.push([state.sessionId,state.condition,'','','','','','','','','','','','','']);let csv='\ufeff'+rows.map(r=>r.join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lios_demo_'+state.sessionId+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
